services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: nova-app
        container_name: nova-app
        restart: unless-stopped
        working_dir: /var/www
        command: sh -c "php artisan storage:link && php-fpm"
        volumes:
            - ./:/var/www
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
        networks:
            - nova-network
        depends_on:
            - db


    web:
        image: nginx:alpine
        container_name: nova-web
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - nova-network
        depends_on:
            - app

    db:
        image: postgres:15
        container_name: nova-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: ${DB_USERNAME}
        volumes:
            - db-data:/var/lib/postgresql/data
        networks:
            - nova-network

    # Optional: Adminer to manage DB
    adminer:
        image: adminer
        profiles: ["dev"]
        restart: unless-stopped
        ports:
            - 8081:8080
        networks:
            - nova-network

    npm:
        image: node:20
        container_name: nova-npm
        working_dir: /var/www
        volumes:
            - ./:/var/www
        command: sh -c "npm install && npm run dev -- --host"
        ports:
            - "5173:5173"
        networks:
            - nova-network

    redis:
        image: redis:7-alpine
        container_name: nova-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        networks:
            - nova-network

networks:
    nova-network:
        driver: bridge

volumes:
    db-data:

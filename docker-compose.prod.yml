services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile.prod
        image: nova-app-prod
        container_name: nova-app-prod
        restart: always
        command: sh -c "php artisan storage:link && php-fpm"
        environment:
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            APP_ENV: production
            APP_DEBUG: "false"
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            QUEUE_CONNECTION: redis
        networks:
            - nova-network
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
            interval: 30s
            timeout: 10s
            retries: 3
        deploy:
            resources:
                limits:
                    memory: 512M
        volumes:
            # We mount public to a named volume so nginx can access the compiled assets
            - app-public:/var/www/public

    web:
        image: nginx:alpine
        container_name: nova-web-prod
        restart: always
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - app-public:/var/www/public
            - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
            # IMPORTANT: Mount your SSL certificates here before starting
            # - ./docker/nginx/ssl:/etc/nginx/ssl
        networks:
            - nova-network
        depends_on:
            app:
                condition: service_healthy

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile.prod
        image: nova-app-prod
        container_name: nova-queue-prod
        restart: always
        command: php artisan queue:work --sleep=3 --tries=3
        environment:
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            APP_ENV: production
            APP_DEBUG: "false"
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            QUEUE_CONNECTION: redis
        networks:
            - nova-network
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    memory: 256M

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile.prod
        image: nova-app-prod
        container_name: nova-scheduler-prod
        restart: always
        command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
        environment:
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            APP_ENV: production
            APP_DEBUG: "false"
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            QUEUE_CONNECTION: redis
        networks:
            - nova-network
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    memory: 256M

    db:
        image: mysql:8.0
        container_name: nova-db-prod
        restart: always
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
        volumes:
            - db-data-prod:/var/lib/mysql
        networks:
            - nova-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    memory: 1G

    redis:
        image: redis:7-alpine
        container_name: nova-redis-prod
        restart: always
        networks:
            - nova-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    memory: 256M

networks:
    nova-network:
        driver: bridge

volumes:
    db-data-prod:
    app-public:
